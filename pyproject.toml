[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diffusion-music-box"
version = "0.1.0"
description = "AI-generated ambient music from noise"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Diffusion Music Box Contributors"}]
keywords = ["diffusion", "ambient", "music", "spectrogram", "audio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "numpy>=1.21",
    "sounddevice>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[project.scripts]
diffusion-music-box = "src.cli:main"

[tool.setuptools]
packages = ["src", "tests"]

[tool.setuptools.package-data]
"src" = ["py.typed"]
